<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#131315" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NABSHÉ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/nabshe-logo.png" />
    <title>NABSHÉ Beauty &amp; Wellness</title>
    <meta name="description" content="Dubai premier salon, wellness treatments, and retail beauty products." />
    <meta property="og:title" content="NABSHÉ Beauty &amp; Wellness" />
    <meta property="og:description" content="Dubai premier salon, wellness treatments, and retail beauty products." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Kufi+Arabic:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #131315;
        color: #e5e1e4;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overscroll-behavior: none;
      }
      .font-serif, .font-headline-sm, .font-headline-md, .font-headline-lg, .font-headline-lg-mobile, .font-display-hero {
        font-family: 'Playfair Display', 'DM Serif Display', Georgia, serif;
      }
      /* When Arabic is active, replace English fonts everywhere at once with Noto Kufi Arabic */
      [dir="rtl"],
      [dir="rtl"] *,
      [lang="ar"],
      [lang="ar"] * {
        font-family: 'Noto Kufi Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      .material-symbols-outlined,
      [dir="rtl"] .material-symbols-outlined,
      [lang="ar"] .material-symbols-outlined {
        font-family: 'Material Symbols Outlined' !important;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Hide standard scrollbars for a native mobile look */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .pb-safe {
        padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    </style>
  </head>
  <body class="bg-[#131315] text-[#e5e1e4] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
