<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131315" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NABSHÉ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>NABSHÉ Beauty &amp; Wellness</title>
    <meta name="description" content="Dubai premier salon, wellness treatments, and retail beauty products." />
    <meta property="og:title" content="NABSHÉ Beauty &amp; Wellness" />
    <meta property="og:description" content="Dubai premier salon, wellness treatments, and retail beauty products." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Resource Hints & Non-blocking Preconnects -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Preload Critical LCP Hero Image with Highest Priority -->
    <link
      rel="preload"
      as="image"
      href="https://lh3.googleusercontent.com/aida-public/AB6AXuB6j7WR1aZZhmNtH4rY9JJb--A5GY7hfoop8fWHZo_YYkIFCwJbyxCPuiO18acyS2sjjeO2E_hkYh1129rvcleHzRElHDS8642K0I1uninuLS53kTam1umlLLmT8adw9Ga8jeNWJz28RZ2voO7At0aY7nkrKVnBIOZtzQ5xAkJZd860wZ0ip6ikEPThOiBXR_seHpk3w428cwDLv684_CoSN_NLvkRc-o0ZX5teIgS3e1BR2T9p95kz"
      fetchpriority="high"
    />

    <!-- 2. Google Fonts stylesheet links with &display=swap for immediate text rendering with system fallbacks -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Kufi+Arabic:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Kufi+Arabic:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Subsetted Material Symbols: 320 KB instead of 4.0 MB, display=swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Kufi+Arabic:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
    </noscript>

    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #131315;
        color: #e5e1e4;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overscroll-behavior: none;
      }
      .font-serif, .font-headline-sm, .font-headline-md, .font-headline-lg, .font-headline-lg-mobile, .font-display-hero {
        font-family: 'Playfair Display', 'DM Serif Display', Georgia, serif;
      }
      /* When Arabic is active, replace English fonts everywhere at once with Noto Kufi Arabic */
      [dir="rtl"],
      [dir="rtl"] *,
      [lang="ar"],
      [lang="ar"] * {
        font-family: 'Noto Kufi Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      /* Reserved dimensions to prevent font swap layout shifts (CLS = 0) */
      .material-symbols-outlined,
      [dir="rtl"] .material-symbols-outlined,
      [lang="ar"] .material-symbols-outlined {
        font-family: 'Material Symbols Outlined' !important;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        width: 1em;
        height: 1em;
        line-height: 1;
        overflow: hidden;
        vertical-align: middle;
        text-align: center;
        user-select: none;
        font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
      /* Hide standard scrollbars for a native mobile look */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .pb-safe {
        padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    </style>
  </head>
  <body class="bg-[#131315] text-[#e5e1e4] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
